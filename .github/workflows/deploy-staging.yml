# 테스트 앱 배포 (staging 브랜치 -> GitHub Pages)
#
# env.js 는 생성 파일이라 저장소에 두지 않고 배포할 때 여기서 만든다.
# 개발/스테이징/운영 설정이 섞이지 않고, 운영 키가 실수로 들어가는 것도 막는다.
name: Deploy test app

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: env.js 생성 (staging)
        run: |
          BUILD="$(date -u +%Y%m%d-%H%M)"
          sed "s/__BUILD__/${BUILD}/g" config/env.staging.js > env.js
          echo "빌드: ${BUILD}"

      - name: 운영 키·비밀키가 섞이지 않았는지 확인
        run: |
          if grep -rn "hjqchbpxwviengdzvado" --include='*.js' --include='*.html' . ; then
            echo "::error::운영 Supabase 참조가 코드에 남아 있습니다"; exit 1
          fi
          if grep -rniE "service_role|sb_secret_|SUPABASE_SERVICE" --include='*.js' --include='*.html' --include='*.json' . ; then
            echo "::error::비밀키로 보이는 문자열이 있습니다"; exit 1
          fi
          echo "확인 완료"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<title>다다맘 TEST · 오프라인</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html,body{height:100%;margin:0}
  body{
    background:#FFFBF5; color:#2B2118;
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{max-width:320px; text-align:center}
  h1{font-size:19px; margin:0 0 8px}
  p{font-size:13.5px; line-height:1.7; color:#6E5F50; margin:0 0 20px}
  button{
    height:46px; padding:0 22px; border:none; border-radius:16px;
    background:#C94318; color:#fff; font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  .tag{display:inline-block; margin-bottom:14px; padding:3px 10px; border-radius:999px;
       background:#C94318; color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.08em}
</style>
<div class="box">
  <span class="tag">TEST</span>
  <h1>연결이 끊겼어요</h1>
  <p>인터넷에 다시 연결되면 이어서 사용할 수 있어요.</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
